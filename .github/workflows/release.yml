name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  binaries:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: sigstore/cosign-installer@v3
      - name: Build release binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist/raw dist/release
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            output="dist/raw/statectl_${VERSION}_${os}_${arch}"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "$output" ./cmd/statectl
            tar -C dist/raw -czf "dist/release/$(basename "$output").tar.gz" "$(basename "$output")"
          done
          for binary in state-server state-relay; do
            for arch in arm64 amd64; do
              output="dist/raw/${binary}_${VERSION}_linux_${arch}"
              GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "$output" "./cmd/${binary}"
              tar -C dist/raw -czf "dist/release/$(basename "$output").tar.gz" "$(basename "$output")"
            done
          done
          cd dist/release
          sha256sum *.tar.gz > checksums.txt
      - name: Sign checksums with GitHub OIDC
        run: cosign sign-blob --yes --bundle dist/release/checksums.txt.bundle dist/release/checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/release/* --generate-notes --verify-tag

  containers:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [state-server, state-relay]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.target }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/nicremo/${{ matrix.target }}:${{ github.ref_name }}
            ghcr.io/nicremo/${{ matrix.target }}:latest
          build-args: STATE_VERSION=${{ github.ref_name }}
      - name: Sign container image with GitHub OIDC
        run: cosign sign --yes ghcr.io/nicremo/${{ matrix.target }}@${{ steps.build.outputs.digest }}
