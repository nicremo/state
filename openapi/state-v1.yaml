openapi: 3.1.0
info:
  title: State API
  version: 1.0.0
  description: REST contract for the self-hosted State reminder and context service.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: https://state.example.com
security:
  - bearerAuth: []
tags:
  - name: System
  - name: Pairing
  - name: Credentials
  - name: Reminders
  - name: Occurrences
  - name: Sync
  - name: Devices
  - name: Projects
  - name: Policies
  - name: Runners
  - name: Runs
paths:
  /health/live:
    get:
      tags: [System]
      operationId: healthLive
      security: []
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /health/ready:
    get:
      tags: [System]
      operationId: healthReady
      security: []
      responses:
        "200":
          description: Service dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Service dependencies are not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /version:
    get:
      tags: [System]
      operationId: getVersion
      security: []
      responses:
        "200":
          description: Running service and API version.
          content:
            application/json:
              schema:
                type: object
                required: [name, version, api_version]
                properties:
                  name: { type: string, const: state-server }
                  version: { type: string }
                  api_version: { type: string, const: v1 }
  /api/v1/pairing/owner:
    post:
      tags: [Pairing]
      operationId: bootstrapOwner
      security: []
      parameters:
        - name: X-State-Bootstrap-Token
          in: header
          required: true
          schema: { type: string, minLength: 32 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerBootstrapRequest"
      responses:
        "201":
          description: Owner credential created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/pairing/codes:
    post:
      tags: [Pairing]
      operationId: createPairingCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairingCodeRequest"
      responses:
        "201":
          description: One-time code created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingCode"
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/pairing/exchange:
    post:
      tags: [Pairing]
      operationId: exchangePairingCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, minLength: 8 }
      responses:
        "201":
          description: Device or harness credential created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/credentials/rotate:
    post:
      tags: [Credentials]
      operationId: rotateCredential
      responses:
        "200":
          description: Replacement credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/credentials/revoke:
    post:
      tags: [Credentials]
      operationId: revokeCredential
      responses:
        "204": { description: Credential revoked. }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/agents:
    get:
      tags: [Credentials]
      operationId: listAgents
      responses:
        "200":
          description: Harness actors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActorList"
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/agents/{actor_id}:
    delete:
      tags: [Credentials]
      operationId: revokeAgent
      parameters:
        - $ref: "#/components/parameters/ActorID"
      responses:
        "204": { description: Agent revoked. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/devices:
    get:
      tags: [Devices]
      operationId: listDevices
      responses:
        "200":
          description: Device actors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActorList"
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/devices/{actor_id}:
    delete:
      tags: [Devices]
      operationId: revokeDevice
      parameters:
        - $ref: "#/components/parameters/ActorID"
      responses:
        "204": { description: Device revoked. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/devices/push:
    put:
      tags: [Devices]
      operationId: registerDevicePush
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDevicePushRequest"
      responses:
        "200":
          description: Personal server push route stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceRoute"
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Devices]
      operationId: deleteDevicePush
      responses:
        "204": { description: Push route removed. }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/devices/push/confirmations:
    post:
      tags: [Devices]
      operationId: confirmLocalNotifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [occurrence_ids]
              properties:
                occurrence_ids:
                  type: array
                  maxItems: 64
                  uniqueItems: true
                  items: { $ref: "#/components/schemas/UUIDv7" }
      responses:
        "204": { description: Local notification coverage confirmed. }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/reminders:
    get:
      tags: [Reminders]
      operationId: listReminders
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 500 }
        - name: include_archived
          in: query
          schema: { type: boolean, default: false }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Matching reminders.
          content:
            application/json:
              schema:
                type: object
                required: [reminders]
                properties:
                  reminders:
                    type: array
                    items: { $ref: "#/components/schemas/Reminder" }
        "400": { $ref: "#/components/responses/Error" }
    post:
      tags: [Reminders]
      operationId: createReminder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReminderRequest"
      responses:
        "201":
          description: Reminder stored with its audit event.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reminder" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/reminders/{reminder_id}:
    parameters:
      - $ref: "#/components/parameters/ReminderID"
    get:
      tags: [Reminders]
      operationId: getReminder
      responses:
        "200":
          description: Current reminder, comments, occurrences and full history.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReminderDetail" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [Reminders]
      operationId: updateReminder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateReminderRequest" }
      responses:
        "200":
          description: Updated reminder.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reminder" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: Revision conflict. The current server reminder is in details.server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/reminders/{reminder_id}/comments:
    parameters:
      - $ref: "#/components/parameters/ReminderID"
    get:
      tags: [Reminders]
      operationId: listComments
      responses:
        "200":
          description: Reminder comments.
          content:
            application/json:
              schema:
                type: object
                required: [comments]
                properties:
                  comments:
                    type: array
                    items: { $ref: "#/components/schemas/Comment" }
    post:
      tags: [Reminders]
      operationId: addComment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddCommentRequest" }
      responses:
        "201":
          description: Comment stored with its audit event.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/reminders/{reminder_id}/history:
    get:
      tags: [Reminders]
      operationId: getReminderHistory
      parameters:
        - $ref: "#/components/parameters/ReminderID"
      responses:
        "200":
          description: Ordered immutable audit events.
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEvent" }
  /api/v1/reminders/{reminder_id}/occurrences:
    get:
      tags: [Occurrences]
      operationId: listOccurrences
      parameters:
        - $ref: "#/components/parameters/ReminderID"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/OccurrenceStatus" }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Reminder occurrences.
          content:
            application/json:
              schema:
                type: object
                required: [occurrences]
                properties:
                  occurrences:
                    type: array
                    items: { $ref: "#/components/schemas/Occurrence" }
  /api/v1/occurrences/{occurrence_id}/complete:
    post:
      tags: [Occurrences]
      operationId: completeOccurrence
      parameters:
        - $ref: "#/components/parameters/OccurrenceID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OccurrenceMutationRequest" }
      responses:
        "200":
          description: Completed occurrence.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Occurrence" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/occurrences/{occurrence_id}/snooze:
    post:
      tags: [Occurrences]
      operationId: snoozeOccurrence
      parameters:
        - $ref: "#/components/parameters/OccurrenceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/OccurrenceMutationRequest"
                - type: object
                  required: [until]
                  properties:
                    until: { type: string, format: date-time }
      responses:
        "200":
          description: Snoozed occurrence.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Occurrence" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/changes:
    get:
      tags: [Sync]
      operationId: getChanges
      parameters:
        - $ref: "#/components/parameters/AfterCursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Ordered change feed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangesResponse" }
  /api/v1/briefing:
    get:
      tags: [Sync]
      operationId: getBriefing
      parameters:
        - $ref: "#/components/parameters/AfterCursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Bounded agent session context.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Briefing" }
  /api/v1/export:
    get:
      tags: [Sync]
      operationId: exportState
      description: Owner-only complete JSON export including archived reminders and full context.
      responses:
        "200":
          description: Point-in-time logical export.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Export" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/projects:
    post:
      tags: [Projects]
      operationId: createProject
      description: Owner-only. Creates a project a runner may serve.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project stored with its audit event.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    get:
      tags: [Projects]
      operationId: listProjects
      description: Owner and device read access.
      responses:
        "200":
          description: All projects.
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects:
                    type: array
                    items: { $ref: "#/components/schemas/Project" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{project_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags: [Projects]
      operationId: getProject
      description: Owner and device read access.
      responses:
        "200":
          description: Project detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [Projects]
      operationId: updateProject
      description: Owner-only update with optimistic revision checking.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Updated project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/policies:
    post:
      tags: [Policies]
      operationId: createPolicy
      description: Owner-only. Creates an execution policy; invalid capability/mode combinations answer 403 policy_violation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePolicyRequest"
      responses:
        "201":
          description: Policy stored with its audit event.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecutionPolicy" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    get:
      tags: [Policies]
      operationId: listPolicies
      description: Owner and device read access.
      responses:
        "200":
          description: All execution policies.
          content:
            application/json:
              schema:
                type: object
                required: [policies]
                properties:
                  policies:
                    type: array
                    items: { $ref: "#/components/schemas/ExecutionPolicy" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/policies/{policy_id}:
    parameters:
      - $ref: "#/components/parameters/PolicyID"
    get:
      tags: [Policies]
      operationId: getPolicy
      description: Owner and device read access.
      responses:
        "200":
          description: Policy detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecutionPolicy" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [Policies]
      operationId: updatePolicy
      description: Owner-only update with optimistic revision checking. Runs pin the policy revision at materialization, so edits never change existing runs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePolicyRequest"
      responses:
        "200":
          description: Updated policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecutionPolicy" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/runner/registration:
    post:
      tags: [Runners]
      operationId: registerRunner
      description: Runner self-registration on first contact. Re-registering updates the stored scopes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRunnerRequest"
      responses:
        "201":
          description: Runner profile stored with its audit event.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Runner" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/runner/claims:
    post:
      tags: [Runs]
      operationId: claimAgentRun
      description: Runner long-poll claim of the oldest eligible run it may serve. The server caps wait_seconds at 25. An empty pool answers 409 not_claimable.
      parameters:
        - name: wait_seconds
          in: query
          schema: { type: integer, minimum: 0, maximum: 25, default: 0 }
      responses:
        "200":
          description: Claimed run with its task contract and lease.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRun" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409":
          description: No claimable run (code not_claimable).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/runner/runs/{run_id}/events:
    parameters:
      - $ref: "#/components/parameters/RunID"
    post:
      tags: [Runs]
      operationId: reportRunEvent
      description: Runner reports started, progress, or a lease-extending heartbeat. Stale revisions answer 409 run_state_conflict.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunEventRequest"
      responses:
        "200":
          description: Current run after the event.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRun" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/runner/runs/{run_id}/complete:
    parameters:
      - $ref: "#/components/parameters/RunID"
    post:
      tags: [Runs]
      operationId: completeAgentRun
      description: Runner finalizes its claimed run. An outcome/exit-code disagreement marks the run failed with failure_code evidence_mismatch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteRunRequest"
      responses:
        "200":
          description: Terminal run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRun" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/runner/runs/{run_id}/approval:
    parameters:
      - $ref: "#/components/parameters/RunID"
    post:
      tags: [Runs]
      operationId: requestRunApproval
      description: Runner escalates one capability outside the policy allow-list; the run parks in needs_approval until the owner decides.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestApprovalRequest"
      responses:
        "200":
          description: Run waiting for the owner decision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRun" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/runners:
    get:
      tags: [Runners]
      operationId: listRunners
      description: Owner and device read access.
      responses:
        "200":
          description: Registered runners.
          content:
            application/json:
              schema:
                type: object
                required: [runners]
                properties:
                  runners:
                    type: array
                    items: { $ref: "#/components/schemas/Runner" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/runners/{runner_id}:
    parameters:
      - $ref: "#/components/parameters/RunnerID"
    patch:
      tags: [Runners]
      operationId: updateRunner
      description: Owner-only edit of the runner's display name, project, and adapter scopes. Revocation uses DELETE /api/v1/agents/{actor_id}.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRunnerRequest"
      responses:
        "200":
          description: Updated runner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Runner" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/runs:
    get:
      tags: [Runs]
      operationId: listRuns
      description: Owner and device read access, newest first.
      parameters:
        - name: reminder_id
          in: query
          schema: { $ref: "#/components/schemas/UUIDv7" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/AgentRunStatus" }
        - name: runner_id
          in: query
          schema: { $ref: "#/components/schemas/UUIDv7" }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Matching agent runs.
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items: { $ref: "#/components/schemas/AgentRun" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [Runs]
      operationId: createManualRun
      description: Owner-only manual run for a reminder under an execution policy. Idempotent on client_request_id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateManualRunRequest"
      responses:
        "201":
          description: Eligible run created with its audit event.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRun" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/runs/{run_id}:
    parameters:
      - $ref: "#/components/parameters/RunID"
    get:
      tags: [Runs]
      operationId: getRun
      description: Owner and device read access.
      responses:
        "200":
          description: Agent run detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRun" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/runs/{run_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/RunID"
    post:
      tags: [Runs]
      operationId: cancelRun
      description: Owner-only cancellation of any non-terminal run; a claimed runner observes it on its next call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelRunRequest"
      responses:
        "200":
          description: Cancelled run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRun" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: Run already terminal (code run_state_conflict).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/runs/{run_id}/approval:
    parameters:
      - $ref: "#/components/parameters/RunID"
    post:
      tags: [Runs]
      operationId: approveRun
      description: Owner-only decision on a needs_approval run. Approving resumes with a fresh lease; declining cancels with failure_code approval_declined.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveRunRequest"
      responses:
        "200":
          description: Run after the decision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRun" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: Run not waiting for approval (code run_state_conflict).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /mcp:
    post:
      tags: [Sync]
      operationId: mcpStreamableHTTP
      description: MCP Streamable HTTP endpoint. Content types and session behavior follow the negotiated MCP protocol version.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: MCP JSON or server-sent event stream.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
            text/event-stream:
              schema: { type: string }
        "202": { description: MCP notification accepted. }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ActorID:
      name: actor_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/UUIDv7" }
    ReminderID:
      name: reminder_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/UUIDv7" }
    OccurrenceID:
      name: occurrence_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/UUIDv7" }
    ProjectID:
      name: project_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/UUIDv7" }
    PolicyID:
      name: policy_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/UUIDv7" }
    RunnerID:
      name: runner_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/UUIDv7" }
    RunID:
      name: run_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/UUIDv7" }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    AfterCursor:
      name: after
      in: query
      schema: { type: integer, format: int64, minimum: 0, default: 0 }
  responses:
    Error:
      description: Structured API error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    UUIDv7:
      type: string
      format: uuid
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, ready, not_ready] }
    ActorKind:
      type: string
      enum: [owner, device, harness, system, runner]
    Actor:
      type: object
      required: [id, kind]
      properties:
        id: { $ref: "#/components/schemas/UUIDv7" }
        kind: { $ref: "#/components/schemas/ActorKind" }
        display_name: { type: [string, "null"] }
        harness: { type: [string, "null"] }
        device_name: { type: [string, "null"] }
    ActorList:
      type: object
      required: [actors]
      properties:
        actors:
          type: array
          items: { $ref: "#/components/schemas/ActorRecord" }
    ActorRecord:
      type: object
      required: [actor, created_at]
      properties:
        actor: { $ref: "#/components/schemas/Actor" }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
    OwnerBootstrapRequest:
      type: object
      required: [display_name, device_name]
      properties:
        display_name: { type: string, minLength: 1, maxLength: 200 }
        device_name: { type: string, minLength: 1, maxLength: 200 }
    PairingCodeRequest:
      type: object
      required: [display_name]
      properties:
        kind: { type: string, enum: [device, harness, runner] }
        harness: { type: [string, "null"], enum: [codex, claude-code, opencode, null] }
        display_name: { type: string, minLength: 1, maxLength: 200 }
        device_name: { type: string, minLength: 1, maxLength: 200 }
    PairingCode:
      type: object
      required: [code, expires_at]
      properties:
        code: { type: string }
        expires_at: { type: string, format: date-time }
    Credential:
      type: object
      required: [actor, token]
      properties:
        actor: { $ref: "#/components/schemas/Actor" }
        token: { type: string, minLength: 32, writeOnly: true }
    ReminderStatus:
      type: string
      enum: [active, completed]
    TimeZoneMode:
      type: string
      enum: [floating, fixed]
    Schedule:
      type: object
      required: [local_date, time_zone, mode]
      properties:
        local_date: { type: string, format: date }
        local_time:
          type: [string, "null"]
          pattern: "^[0-2][0-9]:[0-5][0-9]$"
        time_zone:
          type: string
          description: IANA time zone identifier.
        mode: { $ref: "#/components/schemas/TimeZoneMode" }
        prewarning_minutes: { type: [integer, "null"], minimum: 0, maximum: 525600 }
    RecurrenceRule:
      type: object
      required: [frequency, interval]
      properties:
        frequency: { type: string, enum: [daily, weekly, monthly, yearly] }
        interval: { type: integer, minimum: 1, maximum: 100 }
        until_date: { type: [string, "null"], format: date }
    Reminder:
      type: object
      required: [id, title, status, revision, archived, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/UUIDv7" }
        title: { type: string, minLength: 1, maxLength: 500 }
        description: { type: [string, "null"], maxLength: 100000 }
        status: { $ref: "#/components/schemas/ReminderStatus" }
        schedule:
          oneOf:
            - $ref: "#/components/schemas/Schedule"
            - type: "null"
        recurrence:
          oneOf:
            - $ref: "#/components/schemas/RecurrenceRule"
            - type: "null"
        execution_policy_id:
          oneOf:
            - $ref: "#/components/schemas/UUIDv7"
            - type: "null"
        revision: { type: integer, format: int64, minimum: 1 }
        archived: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    OccurrenceStatus:
      type: string
      enum: [pending, completed, snoozed]
    Occurrence:
      type: object
      required: [id, reminder_id, local_date, time_zone, time_zone_mode, status, revision, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/UUIDv7" }
        reminder_id: { $ref: "#/components/schemas/UUIDv7" }
        local_date: { type: string, format: date }
        local_time: { type: [string, "null"] }
        time_zone: { type: string }
        time_zone_mode: { $ref: "#/components/schemas/TimeZoneMode" }
        prewarning_minutes: { type: [integer, "null"] }
        scheduled_at: { type: [string, "null"], format: date-time }
        status: { $ref: "#/components/schemas/OccurrenceStatus" }
        completed_at: { type: [string, "null"], format: date-time }
        snoozed_until: { type: [string, "null"], format: date-time }
        revision: { type: integer, format: int64, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Comment:
      type: object
      required: [id, reminder_id, body, actor, revision, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/UUIDv7" }
        reminder_id: { $ref: "#/components/schemas/UUIDv7" }
        body: { type: string, minLength: 1, maxLength: 100000 }
        actor: { $ref: "#/components/schemas/Actor" }
        revision: { type: integer, format: int64, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AuditEvent:
      type: object
      required: [id, reminder_id, action, actor, server_time, changed_fields, revision, correlation_id, client_request_id, hash, signature]
      properties:
        id: { $ref: "#/components/schemas/UUIDv7" }
        reminder_id: { $ref: "#/components/schemas/UUIDv7" }
        action: { type: string }
        actor: { $ref: "#/components/schemas/Actor" }
        server_time: { type: string, format: date-time }
        client_time: { type: [string, "null"], format: date-time }
        source: { type: [string, "null"] }
        source_excerpt: { type: [string, "null"] }
        before_snapshot: { type: [object, array, string, number, boolean, "null"] }
        after_snapshot: { type: [object, array, string, number, boolean, "null"] }
        changed_fields:
          type: array
          items: { type: string }
        revision: { type: integer, format: int64, minimum: 1 }
        correlation_id: { type: string }
        client_request_id: { type: string }
        previous_hash: { type: [string, "null"] }
        hash: { type: string }
        signature: { type: string }
    ReminderDetail:
      type: object
      required: [reminder, comments, occurrences, history, runs]
      properties:
        reminder: { $ref: "#/components/schemas/Reminder" }
        comments:
          type: array
          items: { $ref: "#/components/schemas/Comment" }
        occurrences:
          type: array
          items: { $ref: "#/components/schemas/Occurrence" }
        history:
          type: array
          items: { $ref: "#/components/schemas/AuditEvent" }
        runs:
          description: Latest 20 agent runs of this reminder.
          type: array
          items: { $ref: "#/components/schemas/AgentRun" }
    MutationMetadata:
      type: object
      required: [client_request_id]
      properties:
        client_time: { type: [string, "null"], format: date-time }
        source: { type: string, maxLength: 200 }
        source_excerpt: { type: [string, "null"], maxLength: 10000 }
        client_request_id: { type: string, minLength: 1, maxLength: 200 }
        correlation_id: { type: string, maxLength: 200 }
    CreateReminderRequest:
      allOf:
        - $ref: "#/components/schemas/MutationMetadata"
        - type: object
          required: [title]
          properties:
            title: { type: string, minLength: 1, maxLength: 500 }
            description: { type: [string, "null"], maxLength: 100000 }
            schedule:
              oneOf:
                - $ref: "#/components/schemas/Schedule"
                - type: "null"
            recurrence:
              oneOf:
                - $ref: "#/components/schemas/RecurrenceRule"
                - type: "null"
            execution_policy_id:
              oneOf:
                - $ref: "#/components/schemas/UUIDv7"
                - type: "null"
    UpdateReminderRequest:
      allOf:
        - $ref: "#/components/schemas/MutationMetadata"
        - type: object
          required: [expected_revision]
          properties:
            title: { type: string, minLength: 1, maxLength: 500 }
            description: { type: [string, "null"], maxLength: 100000 }
            status: { $ref: "#/components/schemas/ReminderStatus" }
            schedule:
              oneOf:
                - $ref: "#/components/schemas/Schedule"
                - type: "null"
            recurrence:
              oneOf:
                - $ref: "#/components/schemas/RecurrenceRule"
                - type: "null"
            execution_policy_id:
              description: Explicit null detaches the policy.
              oneOf:
                - $ref: "#/components/schemas/UUIDv7"
                - type: "null"
            archived: { type: boolean }
            expected_revision: { type: integer, format: int64, minimum: 1 }
    AddCommentRequest:
      allOf:
        - $ref: "#/components/schemas/MutationMetadata"
        - type: object
          required: [body]
          properties:
            body: { type: string, minLength: 1, maxLength: 100000 }
    OccurrenceMutationRequest:
      allOf:
        - $ref: "#/components/schemas/MutationMetadata"
        - type: object
          required: [expected_revision]
          properties:
            expected_revision: { type: integer, format: int64, minimum: 1 }
    Change:
      type: object
      required: [cursor, event]
      properties:
        cursor: { type: integer, format: int64, minimum: 1 }
        event: { $ref: "#/components/schemas/AuditEvent" }
    ChangesResponse:
      type: object
      required: [changes, cursor]
      properties:
        changes:
          type: array
          items: { $ref: "#/components/schemas/Change" }
        cursor: { type: integer, format: int64, minimum: 0 }
    Briefing:
      type: object
      required: [generated_at, cursor, summary, reminders, changes]
      properties:
        generated_at: { type: string, format: date-time }
        cursor: { type: integer, format: int64, minimum: 0 }
        summary: { type: string }
        reminders:
          type: array
          items: { $ref: "#/components/schemas/Reminder" }
        changes:
          type: array
          items: { $ref: "#/components/schemas/Change" }
    Export:
      type: object
      required: [api_version, generated_at, cursor, reminders]
      properties:
        api_version: { type: string, const: v1 }
        generated_at: { type: string, format: date-time }
        cursor: { type: integer, format: int64, minimum: 0 }
        reminders:
          type: array
          items: { $ref: "#/components/schemas/ReminderDetail" }
    ProjectSlug:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{0,62}[a-z0-9]$"
    Project:
      type: object
      required: [id, name, revision, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/UUIDv7" }
        name: { $ref: "#/components/schemas/ProjectSlug" }
        description: { type: [string, "null"], maxLength: 100000 }
        root_path_hint:
          type: [string, "null"]
          description: Informational checkout hint (e.g. ~/src/customer-api); the runner still enforces its own configured root.
          maxLength: 1000
        revision: { type: integer, format: int64, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateProjectRequest:
      allOf:
        - $ref: "#/components/schemas/MutationMetadata"
        - type: object
          required: [name]
          properties:
            name: { $ref: "#/components/schemas/ProjectSlug" }
            description: { type: [string, "null"], maxLength: 100000 }
            root_path_hint: { type: [string, "null"], maxLength: 1000 }
    UpdateProjectRequest:
      allOf:
        - $ref: "#/components/schemas/MutationMetadata"
        - type: object
          required: [expected_revision]
          properties:
            name: { $ref: "#/components/schemas/ProjectSlug" }
            description: { type: [string, "null"], maxLength: 100000 }
            root_path_hint: { type: [string, "null"], maxLength: 1000 }
            expected_revision: { type: integer, format: int64, minimum: 1 }
    ExecutionMode:
      type: string
      enum: [supervised, unattended-low-risk]
    Capability:
      type: string
      enum: [read_repository, edit_repository, run_tests, read_state_context, write_state, network_access, deploy, message_external, destructive]
    ExecutionPolicy:
      type: object
      required: [id, name, project_id, adapter, mode, allowed_capabilities, mark_occurrence_done_on_success, notify_on_start, notify_on_completion, notify_on_failure, timeout_minutes, enabled, revision, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/UUIDv7" }
        name: { $ref: "#/components/schemas/ProjectSlug" }
        project_id: { $ref: "#/components/schemas/UUIDv7" }
        adapter:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,30}[a-z0-9]$"
        mode: { $ref: "#/components/schemas/ExecutionMode" }
        allowed_capabilities:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/Capability" }
        mark_occurrence_done_on_success: { type: boolean }
        notify_on_start: { type: boolean }
        notify_on_completion: { type: boolean }
        notify_on_failure: { type: boolean }
        timeout_minutes: { type: integer, minimum: 1, maximum: 240 }
        enabled: { type: boolean }
        revision: { type: integer, format: int64, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreatePolicyRequest:
      allOf:
        - $ref: "#/components/schemas/MutationMetadata"
        - type: object
          required: [name, project_id, adapter, mode, allowed_capabilities, timeout_minutes]
          properties:
            name: { $ref: "#/components/schemas/ProjectSlug" }
            project_id: { $ref: "#/components/schemas/UUIDv7" }
            adapter:
              type: string
              pattern: "^[a-z0-9][a-z0-9-]{0,30}[a-z0-9]$"
            mode: { $ref: "#/components/schemas/ExecutionMode" }
            allowed_capabilities:
              description: unattended-low-risk mode accepts only read_repository, read_state_context, run_tests, edit_repository.
              type: array
              uniqueItems: true
              items: { $ref: "#/components/schemas/Capability" }
            mark_occurrence_done_on_success: { type: boolean }
            notify_on_start: { type: boolean }
            notify_on_completion: { type: boolean }
            notify_on_failure: { type: boolean }
            timeout_minutes: { type: integer, minimum: 1, maximum: 240 }
    UpdatePolicyRequest:
      allOf:
        - $ref: "#/components/schemas/MutationMetadata"
        - type: object
          required: [expected_revision]
          properties:
            name: { $ref: "#/components/schemas/ProjectSlug" }
            adapter:
              type: string
              pattern: "^[a-z0-9][a-z0-9-]{0,30}[a-z0-9]$"
            mode: { $ref: "#/components/schemas/ExecutionMode" }
            allowed_capabilities:
              type: array
              uniqueItems: true
              items: { $ref: "#/components/schemas/Capability" }
            mark_occurrence_done_on_success: { type: boolean }
            notify_on_start: { type: boolean }
            notify_on_completion: { type: boolean }
            notify_on_failure: { type: boolean }
            timeout_minutes: { type: integer, minimum: 1, maximum: 240 }
            enabled: { type: boolean }
            expected_revision: { type: integer, format: int64, minimum: 1 }
    Runner:
      type: object
      required: [id, display_name, projects, adapters, registered_at, last_seen_at, revision]
      properties:
        id:
          $ref: "#/components/schemas/UUIDv7"
          description: Matches the actor ID of kind runner.
        display_name: { type: string, minLength: 1, maxLength: 200 }
        projects:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/UUIDv7" }
        adapters:
          type: array
          uniqueItems: true
          items: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,30}[a-z0-9]$" }
        registered_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        revision: { type: integer, format: int64, minimum: 1 }
    RegisterRunnerRequest:
      allOf:
        - $ref: "#/components/schemas/MutationMetadata"
        - type: object
          required: [display_name, projects, adapters]
          properties:
            display_name: { type: string, minLength: 1, maxLength: 200 }
            projects:
              type: array
              uniqueItems: true
              items: { $ref: "#/components/schemas/UUIDv7" }
            adapters:
              type: array
              uniqueItems: true
              items: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,30}[a-z0-9]$" }
    UpdateRunnerRequest:
      allOf:
        - $ref: "#/components/schemas/MutationMetadata"
        - type: object
          required: [expected_revision]
          properties:
            display_name: { type: string, minLength: 1, maxLength: 200 }
            projects:
              type: array
              uniqueItems: true
              items: { $ref: "#/components/schemas/UUIDv7" }
            adapters:
              type: array
              uniqueItems: true
              items: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,30}[a-z0-9]$" }
            expected_revision: { type: integer, format: int64, minimum: 1 }
    AgentRunStatus:
      type: string
      enum: [planned, eligible, claimed, running, needs_approval, succeeded, failed, cancelled, expired]
    TaskContract:
      type: object
      required: [run_id, correlation_id, objective, project_id, project_name, policy_id, policy_revision, contract_hash, allowed_capabilities, timeout_minutes]
      properties:
        run_id: { $ref: "#/components/schemas/UUIDv7" }
        correlation_id: { type: string }
        objective: { type: string }
        acceptance_criteria:
          type: array
          items: { type: string }
        project_id: { $ref: "#/components/schemas/UUIDv7" }
        project_name: { type: string }
        policy_id: { $ref: "#/components/schemas/UUIDv7" }
        policy_revision: { type: integer, format: int64, minimum: 1 }
        contract_hash:
          type: string
          description: SHA-256 over the canonical contract JSON; the runner recomputes it and refuses mismatches.
        allowed_capabilities:
          type: array
          items: { $ref: "#/components/schemas/Capability" }
        timeout_minutes: { type: integer, minimum: 1, maximum: 240 }
        completion_rule: { type: [string, "null"], enum: [mark_occurrence_done_on_success, null] }
    AgentRun:
      type: object
      required: [id, reminder_id, policy_id, policy_revision, project_id, adapter, status, idempotency_key, task_contract, context_cursor, created_by_actor, revision, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/UUIDv7" }
        reminder_id: { $ref: "#/components/schemas/UUIDv7" }
        occurrence_id:
          oneOf:
            - $ref: "#/components/schemas/UUIDv7"
            - type: "null"
        policy_id: { $ref: "#/components/schemas/UUIDv7" }
        policy_revision: { type: integer, format: int64, minimum: 1 }
        project_id: { $ref: "#/components/schemas/UUIDv7" }
        adapter: { type: string }
        runner_id:
          description: Set at claim time.
          oneOf:
            - $ref: "#/components/schemas/UUIDv7"
            - type: "null"
        status: { $ref: "#/components/schemas/AgentRunStatus" }
        idempotency_key: { type: string }
        task_contract: { $ref: "#/components/schemas/TaskContract" }
        context_cursor: { type: integer, format: int64, minimum: 0 }
        lease_expires_at: { type: [string, "null"], format: date-time }
        requested_at: { type: [string, "null"], format: date-time }
        claimed_at: { type: [string, "null"], format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        result_summary:
          type: [string, "null"]
          description: Redacted, at most 2000 characters; never log content.
          maxLength: 2000
        result_artifact_ref:
          type: [string, "null"]
          description: Opaque local path label; artifact content never leaves the workstation.
        failure_code: { type: [string, "null"], enum: [evidence_mismatch, approval_declined, null] }
        approval_capability:
          oneOf:
            - $ref: "#/components/schemas/Capability"
            - type: "null"
        created_by_actor: { $ref: "#/components/schemas/Actor" }
        completed_by_actor:
          oneOf:
            - $ref: "#/components/schemas/Actor"
            - type: "null"
        revision: { type: integer, format: int64, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateManualRunRequest:
      allOf:
        - $ref: "#/components/schemas/MutationMetadata"
        - type: object
          required: [reminder_id, policy_id]
          properties:
            reminder_id: { $ref: "#/components/schemas/UUIDv7" }
            policy_id: { $ref: "#/components/schemas/UUIDv7" }
    RunEventRequest:
      type: object
      required: [event, expected_revision]
      properties:
        event: { type: string, enum: [started, progress, heartbeat] }
        detail:
          type: [string, "null"]
          description: One-line redacted status; never log content.
          maxLength: 2000
        expected_revision: { type: integer, format: int64, minimum: 1 }
    CompleteRunRequest:
      allOf:
        - $ref: "#/components/schemas/MutationMetadata"
        - type: object
          required: [outcome, exit_code, expected_revision]
          properties:
            outcome: { type: string, enum: [succeeded, failed] }
            result_summary: { type: [string, "null"], maxLength: 2000 }
            result_artifact_ref: { type: [string, "null"], maxLength: 1000 }
            exit_code: { type: integer }
            expected_revision: { type: integer, format: int64, minimum: 1 }
    RequestApprovalRequest:
      type: object
      required: [capability, expected_revision]
      properties:
        capability:
          $ref: "#/components/schemas/Capability"
          description: Must be outside the policy's allowed set.
        reason: { type: [string, "null"], maxLength: 2000 }
        expected_revision: { type: integer, format: int64, minimum: 1 }
    ApproveRunRequest:
      allOf:
        - $ref: "#/components/schemas/MutationMetadata"
        - type: object
          required: [approved, expected_revision]
          properties:
            approved: { type: boolean }
            expected_revision: { type: integer, format: int64, minimum: 1 }
    CancelRunRequest:
      allOf:
        - $ref: "#/components/schemas/MutationMetadata"
        - type: object
          required: [expected_revision]
          properties:
            expected_revision: { type: integer, format: int64, minimum: 1 }
    RegisterDevicePushRequest:
      type: object
      required: [relay_url, route_id, authorization, public_key]
      properties:
        relay_url: { type: string, format: uri, pattern: "^https://" }
        route_id: { $ref: "#/components/schemas/UUIDv7" }
        authorization: { type: string, minLength: 32, writeOnly: true }
        public_key:
          type: string
          contentEncoding: base64
    DeviceRoute:
      type: object
      required: [actor_id, relay_url, route_id, public_key, created_at, updated_at]
      properties:
        actor_id: { $ref: "#/components/schemas/UUIDv7" }
        relay_url: { type: string, format: uri }
        route_id: { $ref: "#/components/schemas/UUIDv7" }
        public_key: { type: string, contentEncoding: base64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: [object, array, string, number, boolean, "null"] }
